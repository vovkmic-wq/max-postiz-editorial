name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Проверки читают исходники и работают только с временными тестовыми данными.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Ruff, dependencies and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-deployment.lock
      - name: Verify Dependabot dependency manifest
        run: python scripts/check_ci_dependencies.py
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock -r requirements-deployment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: python -m ruff check src tests scripts deployment/translation/benchmark_articles.py
      - name: Dependency compatibility
        run: python -m pip check
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Install and smoke-test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c 'import importlib.metadata; from max_postiz_agent import __version__; assert __version__ == importlib.metadata.version("max-postiz-agent"); print(__version__)'

  python-tests:
    name: Python tests (${{ matrix.os }}, part ${{ matrix.shard_index }}/${{ matrix.shard_count }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard_index: 0
            shard_count: 1
          - os: windows-latest
            shard_index: 0
            shard_count: 4
          - os: windows-latest
            shard_index: 1
            shard_count: 4
          - os: windows-latest
            shard_index: 2
            shard_count: 4
          - os: windows-latest
            shard_index: 3
            shard_count: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-browser.lock
            requirements-deployment.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock -r requirements-browser.lock -r requirements-deployment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Chrome and browser dependencies
        run: python -m playwright install --with-deps chrome
      - name: Create test directory
        run: python -c "from pathlib import Path; Path('.test-state').mkdir(exist_ok=True)"
      - name: Run Python and isolated browser tests with coverage
        if: runner.os == 'Linux'
        run: python -m pytest --basetemp=.test-state/pytest --junitxml=.test-state/tests.xml --cov=max_postiz_agent --cov-report=xml:.test-state/coverage.xml -q
      - name: Run Python and isolated browser tests on Windows
        if: runner.os == 'Windows'
        run: >-
          python scripts/ci_pytest_shard.py
          --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          --shard-receipt .test-state/shard.json
          --basetemp=.test-state/pytest --junitxml=.test-state/tests.xml -q
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-reports-${{ matrix.os }}-${{ matrix.shard_index }}-of-${{ matrix.shard_count }}
          path: |
            .test-state/tests.xml
            .test-state/coverage.xml
            .test-state/shard.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  postgres-tests:
    name: Canonical full checks (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: editorial_hub_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_INITDB_ARGS: --set=cluster_name=codex-max-routes-ci
        ports:
          - 127.0.0.1:55448:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d editorial_hub_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
      monitor-postgres:
        image: postgres:17
        env:
          POSTGRES_DB: editorial_hub_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_INITDB_ARGS: --set=cluster_name=codex-max-monitor-qa
        ports:
          - 127.0.0.1:55449:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d editorial_hub_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Это одноразовая БД GitHub runner; production URL и секреты не используются.
      MAX_POSTIZ_PG_TEST_CONTRACT: github-actions-isolated-pg-v1
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-only@127.0.0.1:55448/editorial_hub_tests
      MONITOR_OWNED_PG_TEST_URL: postgresql+psycopg://postgres:ci-local-only@127.0.0.1:55449/editorial_hub_tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
            requirements-browser.lock
            requirements-deployment.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Create checkout-owned virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock -r requirements-browser.lock -r requirements-deployment.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Chrome and browser dependencies
        run: python -m playwright install --with-deps chrome
      - name: Verify the two owned PostgreSQL identities without mutation
        if: matrix.mode == 'postgres'
        run: python scripts/check_ci_postgres.py
      - name: Run canonical full checks without PostgreSQL
        if: matrix.mode == 'normal'
        run: python scripts/check.py
      - name: Run canonical full checks with PostgreSQL
        if: matrix.mode == 'postgres'
        run: python scripts/check.py --postgres
      - name: Require route and monitor PostgreSQL cases with zero skips
        if: always() && matrix.mode == 'postgres'
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          reports = list(Path("data/check-runs").glob("*/tests.xml"))
          if len(reports) != 1:
              raise SystemExit("Expected exactly one canonical pytest report")
          subprocess.run(
              [sys.executable, "scripts/check_ci_postgres.py", "--junit", str(reports[0])],
              check=True,
          )
          PY
      - name: Save canonical check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-${{ matrix.mode }}-report
          # Только канонический run, без его временных pytest-данных.
          path: |
            data/check-runs/*/report.json
            data/check-runs/*/tests.xml
            data/check-runs/*/installed-wheel.xml
            data/check-runs/*/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  node-tests:
    name: Postiz contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/ci-node/package-lock.json
      - name: Install isolated pinned test tooling
        run: npm ci --prefix .github/ci-node --ignore-scripts --no-audit --no-fund
      - name: Run all Postiz contract suites without live services
        run: node scripts/ci_node_tests.cjs

  required:
    name: CI required
    if: always()
    needs: [quality, python-tests, postgres-tests, node-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every test job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI jobs did not succeed: {failed}")
          print("All required CI jobs passed.")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download Windows collection receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-reports-windows-latest-*-of-4
          path: .test-state/windows-shards
      - name: Verify the complete Windows test partition
        run: python3 scripts/check_ci_shards.py .test-state/windows-shards
