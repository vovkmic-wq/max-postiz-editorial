# Included inside the agent's server block (port 8090).
location = /internal-owner-browser-auth {
  internal;
  proxy_pass http://127.0.0.1:8091/api/hub/owner-browser-authorize;
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
  proxy_set_header Cookie $http_cookie;
  proxy_set_header Host $http_host;
}
location /api/owner-browser/ {
  if ($owner_browser_origin_allowed = 0) { return 403; }
  allow 10.20.30.0/24;
  allow 10.77.0.2/32;
  deny all;
  auth_request /internal-owner-browser-auth;
  error_page 401 =302 /hub;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control no-store always;
  add_header Referrer-Policy no-referrer always;
  proxy_pass http://127.0.0.1:6080/;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_read_timeout 3600s;
}
