[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "max-postiz-agent"
version = "0.15.11"
description = "Автономная редакция на VM с PostgreSQL, OpenCode и управлением из Postiz"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "jsonschema>=4.23,<5",
  "beautifulsoup4>=4.13,<5", "feedparser>=6.0,<7", "tzdata>=2025.1",
  "certifi>=2026.10.23", "opentelemetry-api>=1.45.2,<2",
  "cryptography>=50.0.2,<51", "alembic>=1.15,<2", "imageio-ffmpeg>=0.6,<1",
  "python-multipart==0.0.33", "Pillow>=13,<14"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2"]
browser = ["playwright==1.65.0"]
images = ["onnxruntime>=1.31,<1.32", "Pillow>=13,<14", "tokenizers>=0.23,<0.24", "numpy>=2.5,<3"]

[project.scripts]
hub-agent = "max_postiz_agent.hub_cli:main"
max-agent = "max_postiz_agent.server_cli:main"
editorial-agent = "max_postiz_agent.server_cli:main"
platform-agent = "max_postiz_agent.routes_cli:main"
monitor-agent = "max_postiz_agent.monitor_cli:main"
mobile-agent = "max_postiz_agent.mobile_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
max_postiz_agent = ["static/*", "hub_static/*"]

[tool.setuptools.data-files]
"share/max-postiz" = ["scripts/readback_max.py", "scripts/readback_wheel_proof.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"src/max_postiz_agent/api.py" = ["B008"]
"src/max_postiz_agent/hub_api.py" = ["B008"]
"tests/*" = ["S105", "S106"]

[tool.max-postiz.check]
# Остальные 213 файлов требуют отдельной миграции форматирования.
format-paths = ["scripts/check.py", "tests/test_check.py"]
