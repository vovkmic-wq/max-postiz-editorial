<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редакция</title><link rel="stylesheet" href="/hub-assets/style.css"><script defer src="/hub-assets/app.js"></script></head>
<body><header><h1>Редакция</h1><p>Архив → локальная LLM → согласование → публикация</p><a href="/">Источники и настройки MAX</a></header>
